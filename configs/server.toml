# ==========================================================
#  FarsHub Tunnel — Server side
#  This side runs on the server your users connect to (the
#  abroad box). Ports are listened on here and the client
#  dials in here.
#
#  Installed at: /etc/farshub/server.toml
#  Edit with: farshub edit server
#  Warning: key names are compiled into the engine - do not
#           change them. Edit the values only.
# ==========================================================

[server]
# --- network ---
bind_addr = "0.0.0.0:3080"        # tunnel port; the client connects here
transport = "tcpmux"              # tcp | tcpmux | ws | wss | wsmux | wssmux | udp
token = "CHANGE_ME"               # must be identical in client.toml (>=32 random bytes)

# Ports your real users connect to
ports = [
  # "443",                        # 443 on the server → 443 on the client side
  # "8443=443",                   # 8443 on the server → 443 on the client side
  # "2000-2100",                  # port range
]

# --- resilience ---
heartbeat = 40                    # seconds; tunnel keepalive ping
keepalive_period = 75             # seconds
channel_size = 2048               # internal queue; overflow = new connections dropped
nodelay = true                    # TCP_NODELAY — lower latency, slightly less bandwidth
accept_udp = false                # tunnel UDP over TCP

# --- Multiplexing (only for *mux transports) ---
mux_con = 8
mux_version = 1
mux_framesize = 32768             # 32 KB
mux_recievebuffer = 4194304       # 4 MB — per connection; lower it on low-RAM boxes
mux_streambuffer = 65536          # 64 KB

# --- TLS (required for wss / wssmux) ---
# tls_cert = "/etc/farshub/certs/server.crt"
# tls_key  = "/etc/farshub/certs/server.key"

# --- monitoring and logging ---
sniffer = false                   # traffic inspection; CPU overhead under heavy load
sniffer_log = "/var/log/farshub/traffic.json"
web_port = 0                      # 0 = off. The panel has no authentication;
                                  # if you need it, put it behind nginx with basic auth
log_level = "warn"                # info logs the token value on mismatch errors
pprof = false                     # never enable in production
