# ==========================================================
#  FarsHub Tunnel — Client side
#  This side runs on the machine where your target services
#  live or are reachable (behind NAT / filtering). It listens
#  on no port and always dials the server itself.
#
#  Installed at: /etc/farshub/client.toml
#  Edit with: farshub edit client
#  Warning: key names are compiled into the engine - do not
#           change them. Edit the values only.
# ==========================================================

[client]
# --- network ---
remote_addr = "SERVER_IP:3080"    # server address; a domain beats a raw IP
                                  # (if the server IP changes, the domain resolves again on its own)
transport = "tcpmux"              # must be exactly the same as server.toml
token = "CHANGE_ME"               # must be exactly the same as server.toml
# edge_ip = "188.114.96.0"        # only for passing through a CDN on ws* transports

# --- connection pool and retry ---
connection_pool = 8               # pre-built connections; cuts setup latency
aggressive_pool = false
retry_interval = 3                # seconds; wait between retries after a drop
dial_timeout = 10                 # seconds

# --- resilience ---
keepalive_period = 75
nodelay = true

# --- Multiplexing (must match the server) ---
mux_version = 1
mux_framesize = 32768
mux_recievebuffer = 4194304
mux_streambuffer = 65536

# --- monitoring and logging ---
sniffer = false
sniffer_log = "/var/log/farshub/traffic.json"
web_port = 0
log_level = "warn"
pprof = false
